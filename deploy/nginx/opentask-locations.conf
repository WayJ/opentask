# OpenTask —— 宿主 nginx location 片段
#
# 用途：include 进宿主上**已有的** server 块（本机是 server_name 112.126.60.109
# 的明文 80 站点，与 notegit 共用同一个 server 块）。
#
#   include /etc/nginx/snippets/opentask-locations.conf;
#
# 拓扑：
#   浏览器 → 宿主 nginx :80
#     ├─ /opentask/*        → 127.0.0.1:8080（前端容器；容器内按前缀再分流：
#     │                        /opentask/assets/* 静态、/opentask/api/* 转后端、
#     │                        /opentask/<路由> 回退 index.html）
#     ├─ /oauth2/*          → 127.0.0.1:7377（OAuth2 Provider 端点）
#     ├─ /tasks/*           → 127.0.0.1:7377（任务源契约）
#     ├─ /capabilities      → 127.0.0.1:7377（任务源契约）
#     └─ /healthcheck       → 127.0.0.1:7377（探活）
#
# 为什么 OAuth2 Provider 的端点挂在站点根而不是 /opentask/ 下：
#   前端授权同意页是 **SPA 路由** /opentask/oauth2/authorize，而授权服务器的
#   端点是 /oauth2/token、/oauth2/userinfo、/oauth2/revoke。两者同名段一旦
#   共用前缀就会撞车（同意页与 token 端点无法区分）。故刻意分离：
#   - SPA          → http://112.126.60.109/opentask/
#   - 授权服务器    → http://112.126.60.109/  （token 端点 /oauth2/token）
#
# 容器端口一律绑回环（见 docker-compose.prod.yml），外部只经本层 nginx 进入。

location = /opentask {
    return 301 /opentask/;
}

# SPA + API 都交给前端容器，容器内部再按前缀分流
location /opentask/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket（后端有 websocket 路由）
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# OAuth2 Provider 端点（第三方客户端，如 dsh-saas 换 token）
location /oauth2/ {
    proxy_pass http://127.0.0.1:7377;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# 任务源契约（外部 agent / Orca 接入；API Key 鉴权）
location /tasks/ {
    proxy_pass http://127.0.0.1:7377;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 64m;
    proxy_read_timeout 300s;
}

location = /capabilities {
    proxy_pass http://127.0.0.1:7377;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 探活（不经前端容器，直接打后端）
location = /healthcheck {
    proxy_pass http://127.0.0.1:7377;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
