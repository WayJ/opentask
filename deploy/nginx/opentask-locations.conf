# OpenTask 宿主 nginx location 片段
#
# 主示例是独立站点：把本文件 include 进只服务 OpenTask 的 server，
# 并由该 server 的 location / 把页面转到前端容器 127.0.0.1:8080。
# 见 deploy/nginx/opentask-site.conf。
#
# 本文件不包含第二个 location /。
# 若操作者的机器上已经有别的 server 占用了 location /，需要先处理那一条，
# 否则 / 和 /login 到不了 OpenTask。仓库没有检查过任何现网机器，
# 不能据此声称某台机器上还有其它服务。
#
# 对外路径与改根之前一致，只是 SPA 从前缀 /opentask/ 改到站点根：
#   /api/  /ws/            后端 7377（不剥前缀，不设置 X-Workspace-Id）
#   /oauth2/authorize      前端 8080（SPA 同意页）
#   /oauth2/               后端 7377（token / userinfo / revoke）
#   /tasks/  /capabilities /healthcheck   后端 7377
# 不新增 /rest、/mcp、/docs、/test。

location /api/ {
    proxy_pass http://127.0.0.1:7377;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 64m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location /ws/ {
    proxy_pass http://127.0.0.1:7377;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# SPA 授权同意页。必须写在 /oauth2/ 之前，精确匹配优先。
location = /oauth2/authorize {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /oauth2/ {
    proxy_pass http://127.0.0.1:7377;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
