# OpenTask 前端容器内的 nginx 配置
#
# 职责：
#   1. 托管 vite 构建产物（SPA history fallback 到 index.html）
#   2. 把 /opentask/api/ 前缀的请求反代到后端 7377
#
# ── 路径前缀拓扑（生产与本地 compose 行为一致）────────────────
# 生产把 SPA 挂在 /opentask/ 前缀下（frontend/.env.prod 的 VITE_BASE_URL=/opentask/），
# 前端容器**始终按带前缀的路径**工作：
#
#   /opentask/assets/*  → 静态资源（带 hash，长期缓存）
#   /opentask/api/*     → 后端 /api/*（前缀剥掉；后端路由本身不带前缀）
#   /opentask/<路由>    → index.html（SPA history fallback）
#
# 静态产物落在 /usr/share/nginx/html/**opentask/** 子目录，与 URL 前缀一一对应，
# 于是 try_files 直接命中真实路径——**不需要 rewrite，也不需要 alias**。
#
# 两个关键实现细节（都踩过坑，勿改）：
#
#   a) **运行时解析后端地址**：若写成 `proxy_pass http://backend:7377;`（静态主机名），
#      nginx 只在**启动时**解析一次并把 IP 写死；后端容器一旦重建换 IP，前端就会
#      永久 502（Host is unreachable）。故这里用 Docker 内嵌 DNS（127.0.0.11）
#      做**每请求解析**，后端重启/换 IP 无感。
#   b) **前缀剥离用 rewrite 而非 proxy_pass 的 URI 部分**：proxy_pass 里带变量时，
#      URI 替换语义会变；`rewrite ... break` + 不带 URI 的 proxy_pass 语义明确。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64m;

    # Docker 内嵌 DNS：用于按请求解析后端服务名（见上文 a）
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host backend;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # 静态资源：带 hash 的产物可长期缓存
    location /opentask/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    # API 反代：/opentask/api/xxx → 后端 /api/xxx
    location /opentask/api/ {
        rewrite ^/opentask(/.*)$ $1 break;
        proxy_pass http://$backend_host:7377;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（后端有 websocket 路由）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA 路由回退：/opentask/<任意前端路由> → /opentask/index.html
    location /opentask/ {
        try_files $uri $uri/ /opentask/index.html;
        add_header Cache-Control "no-cache";
    }
}
