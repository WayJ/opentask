# OpenTask 前端容器内的 nginx 配置
#
# 站点根提供 SPA。浏览器路径是 /、/login、/issue/list，不再使用 /opentask 前缀。
# /api/ 与 /ws/workspace 原样转到后端，不剥前缀，也不写入 X-Workspace-Id。
# /ws/hub* 不对外。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64m;

    # Docker 内嵌 DNS：按请求解析后端服务名，避免后端重建后 IP 被写死。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host backend;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    location /api/ {
        proxy_pass http://$backend_host:7377;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /ws/workspace {
        proxy_pass http://$backend_host:7377;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
