[pytest]
# Pytest configuration for OpenTask CLI

# Minimum pytest version
minversion = 7.0

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Warning settings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Markers
markers =
    integration: Integration tests (require real API)
    slow: Slow-running tests
    windows: Windows-specific tests
    asyncio: Async tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Asyncio configuration
# Remove auto-mode to avoid I/O capture issues with pytest
# Tests that need asyncio should explicitly use @pytest.mark.asyncio
# asyncio_mode = auto
