# OpenTask 本地编排（postgres + 后端 + 前端）
#
# 取代此前的 Node+Prisma + MySQL 模板（改名前残留，与本仓栈不符）。
# 现栈：PostgreSQL 15（ADR D11）+ Python 3.11 后端（端口固定 7377）+ vue3 前端（nginx 托管）。
#
# 起停：
#   AUTH_SECRET_KEY=$(openssl rand -hex 32) docker compose up -d
#   docker compose logs -f backend
#   docker compose down
#
# 注：后端不使用 redis（代码中无 redis 依赖），故编排里不设 redis 服务。

name: opentask

services:
  postgres:
    image: postgres:15-alpine
    container_name: opentask-postgres
    environment:
      POSTGRES_USER: opentask
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opentask}
      POSTGRES_DB: opentask
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentask"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opentask-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      # 显式要求：config.py 对 AUTH_SECRET_KEY fail-closed，缺失即拒启动
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?AUTH_SECRET_KEY 必须显式设置（fail-closed）}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: opentask
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opentask}
      POSTGRES_DATABASE: opentask
      DATA_DIRECTORY: /app/data
    ports:
      - "7377:7377"
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opentask-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres-data:
