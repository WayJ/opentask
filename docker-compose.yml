version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: opentask-postgres
    environment:
      POSTGRES_USER: opentask
      POSTGRES_PASSWORD: opentask-password
      POSTGRES_DB: opentask
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentask"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: opentask-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opentask-backend
    environment:
      DATABASE_URL: postgresql://opentask:opentask-password@postgres:5432/opentask
      REDIS_URL: redis://redis:6379
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./repos:/workspace/repos

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opentask-frontend
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
