# OpenTask 默认配置
# 此文件可提交到版本控制

app:
  name: "OpenTask"
  environment: "development"
  debug: true

server:
  host: "0.0.0.0"
  port: 7377

database:
  # PostgreSQL 配置（本地 Docker 容器 opentask-pg）
  postgres:
    host: "localhost"
    port: 5432
    user: "opentask"
    password: "opentask"
    database: "opentask"
    echo: true

auth:
  # 基础认证（真实值请放在 config/local.yaml，不提交）
  username: "admin"
  password: "changeme"
  # secret_key: 生产必须通过环境变量 AUTH_SECRET_KEY 注入，禁止提交真实值

cors:
  # 允许的跨域来源
  allowed_origins:
    - "http://localhost:5173"
    - "http://localhost:7377"
    - "http://0.0.0.0:5173"
    - "http://0.0.0.0:7377"

# AI 模型配置
ai:
  openai:
    api_key: ""
    base_url: ""
  default_model: "openai/gpt4"
  max_tokens: 8192
  available_models:
    - "glm-4-air-0111"
    - "glm-4.6"

# 文件存储
storage:
  data_directory: "./data"
  templates_path: "./templates"
  assets_path: "./assets"

# API 配置
api:
  # OpenTask API 前缀
  prefix: "/api"
  # SSO API 前缀（用于 nginx 代理）
  sso_prefix: "/sso-api"

# SSO 平台配置
sso:
  # SSO 基础地址（后端直接调用）
  base_url: "http://localhost:29080"
  # SSO 系统编码
  app_code: "workSystem"
  # 请求超时（秒）
  timeout: 10

# 任务监控服务配置
task_monitor:
  # 是否启用任务监控服务（true/false）
  enabled: false
  # 检查间隔（分钟）
  check_interval_minutes: 5
  # 超时时间（小时）
  timeout_hours: 1

# 任务源契约配置（Orca 通用任务契约，挂根 /tasks；详见 backend/README.md「任务源契约 API」）
contract:
  # 状态映射：IssueStatus（key）→ Orca 通用状态（value）。
  # - key 必须覆盖全部 6 种 IssueStatus（open/in_progress/feedback/resolved/closed/rejected），
  #   否则视为配置非法，启动后首次访问即报错（拒绝静默降级）
  # - 反向（通用 → IssueStatus）取规范逆：同一通用状态对应多个 IssueStatus 时，
  #   取枚举声明序在前者（如 done ← resolved/closed 取 resolved），保证往返确定
  # - 未配置本段时使用代码内默认表（opentask/api/tasks/mapping.py DEFAULT_*）
  # - 环境配置（development/production/test.yaml）可按 key 覆盖；修改后重启生效
  status_mapping:
    open: todo
    in_progress: in_progress
    feedback: in_review
    resolved: done
    closed: done
    rejected: cancelled
  # 契约层无 type 概念：POST /tasks 落库时的默认 issue 类型（IssueType 词表内取值）
  default_issue_type: feature

# E30 出站邮件（默认未配置 = email_configured false）
smtp:
  host: ""
  port: 587
  user: ""
  password: ""
  from: ""
  tls: true
