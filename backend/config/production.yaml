# 生产环境配置
# 此文件可提交到版本控制
# 敏感信息应通过环境变量覆盖

app:
  environment: "production"
  debug: false

server:
  host: "0.0.0.0"
  port: 7377
  reload: false
  workers: 4

database:
  postgres:
    host: "${POSTGRES_HOST}"  # 从环境变量读取
    port: "${POSTGRES_PORT:5432}"
    user: "${POSTGRES_USER}"
    password: "${POSTGRES_PASSWORD}"
    database: "${POSTGRES_DATABASE}"
    echo: false

auth:
  username: "${AUTH_USERNAME}"  # 从环境变量读取
  password: "${AUTH_PASSWORD}"  # 从环境变量读取
  # secret_key: "${AUTH_SECRET_KEY}"  # JWT 签名密钥，从环境变量读取

ai:
  openai:
    api_key: "${OPENAI_API_KEY}"  # 从环境变量读取
    base_url: "${OPENAI_BASE_URL:}"
  default_model: "openai/gpt4"

# SSO 平台配置
sso:
  # SSO 基础地址（后端直接调用）
  # 从环境变量读取：具体地址属于部署侧信息，不进版本库
  # （SSO 未启用时留空即可）
  base_url: "${SSO_BASE_URL:}"
  # SSO 系统编码
  app_code: "${SSO_APP_CODE:opentask}"
  # 请求超时（秒）
  timeout: 10